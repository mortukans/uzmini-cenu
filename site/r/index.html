<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0F1115">
<title>Uzmini Cenu – istaba</title>
<link rel="icon" href="../icon.png">
<style>
:root{--bg:#0F1115;--surface:#181B22;--border:#2A2F3A;--text:#F4F5F7;--muted:#9AA1AE;--accent:#F5B840;--accent-text:#1A1400}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0;color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:48px 16px;text-align:center}
img{width:96px;height:96px;border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
h1{font-size:26px;margin:20px 0 4px}
code{background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:8px;font-size:20px;letter-spacing:2px}
p{color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-text);border-radius:12px;padding:12px 22px;text-decoration:none;font-weight:700;margin:8px 4px}
.btn.alt{background:var(--surface);color:var(--text);border:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <img src="../icon.png" alt="">
  <h1>Ielūgums uz istabu</h1>
  <p>Istabas kods: <code id="code">…</code></p>
  <p>Atveram lietotni… Ja nekas nenotiek, lietotne vēl nav uzinstalēta.<br><span lang="en">Opening the app… If nothing happens, the app is not installed yet.</span></p>
  <a class="btn" id="open" href="#">Atvērt lietotnē</a>
  <a class="btn alt" id="store" href="https://apps.apple.com/app/id6816056345">App Store</a>
</div>
<script>
(function(){
  var STORE='https://apps.apple.com/app/id6816056345';
  var parts=location.pathname.replace(/\/+$/,'').split('/');
  var code=parts[parts.length-1];
  if(!code||code==='r'||code==='index.html'){var q=new URLSearchParams(location.search);code=q.get('code')||q.get('c')||(location.hash||'').replace('#','');}
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
  var el=document.getElementById('code');el.textContent=code||'?';
  if(!code){document.getElementById('open').style.display='none';return;}
  var deep='uzminicenu://r/'+code;
  document.getElementById('open').href=deep;
  var t=setTimeout(function(){location.href=STORE;},1800);
  document.addEventListener('visibilitychange',function(){if(document.hidden)clearTimeout(t);});
  window.addEventListener('pagehide',function(){clearTimeout(t);});
  location.href=deep;
})();
</script>
</body>
</html>
