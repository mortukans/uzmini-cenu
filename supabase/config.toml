# Supabase CLI project config (minimal, `supabase init` style).
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "uzmini-cenu"

[api]
enabled = true
port = 54321
# Only `public` is exposed through PostgREST; `private` (token helpers) never is.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "uzminicenu://"
additional_redirect_urls = ["uzminicenu://", "https://uzminicenu.lv"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Anonymous-first sign in (docs/04): every device gets a real auth.users row.
enable_anonymous_sign_ins = true
enable_manual_linking = true
enable_signup = true

[auth.rate_limit]
anonymous_users = 30

[auth.email]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.send-push]
verify_jwt = false

[functions.build-daily]
verify_jwt = false

[functions.sweep]
verify_jwt = false

[analytics]
enabled = false
