name: Nightly SS.com scrape

on:
  schedule:
    - cron: '0 18 * * *'   # 21:00 Riga, two hours before build-daily (20:00 UTC)
  workflow_dispatch:
    inputs:
      limit:
        description: 'max detail pages'
        default: '900'


jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://szlqqshbuswezepvnzsb.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_MAILTO: mortukans@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd scraper && npm ci
      - name: Scrape
        run: cd scraper && npx tsx src/index.ts run --limit ${{ github.event.inputs.limit || '900' }}
      - name: Stats
        if: always()
        run: cd scraper && npx tsx src/index.ts stats
